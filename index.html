<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' https: http:; connect-src 'self' https: http: https://api.dictionaryapi.dev; frame-src https://music.cpp-prog.com;">
  <title>WordWord - 单词学习</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
  <div id="backgroundLayer"></div>
  <div id="app">
    <div class="dropdown-backdrop" id="dropdownBackdrop"></div>
    <nav class="navbar">
      <div class="nav-left">
        <div class="wordbook-selector">
          <button class="wordbook-btn" id="wordbookSelectBtn">
            <img src="assets/default-cover.svg" alt="词书封面" class="book-cover">
            <div class="wordbook-info">
              <div class="wordbook-name" id="currentWordbookName">选择词书...</div>
              <div class="wordbook-stats" id="currentWordbookStats"></div>
            </div>
            <div class="btn-arrow">→</div>
          </button>
        </div>
      </div>
      <div class="nav-right">
        <div class="sync-status" id="syncStatus">
          <span class="status-dot green"></span>
          <span class="status-text">已同步</span>
        </div>
        <button class="music-btn" id="musicBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
        <button class="settings-btn" id="settingsBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </nav>

    <main class="main-content">
      <!-- 首页 -->
      <div id="homePage" class="page active">
        <div class="search-container">
          <div class="search-box">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="M21 21l-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchWordInput" placeholder="搜索单词..." class="search-input">
            <button class="search-button" id="searchButton">搜索</button>
            <div id="searchResults" class="search-results"></div>
          </div>
        </div>
        <div class="action-buttons">
          <button class="action-btn primary" id="learnBtn">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <span>学习</span>
          </button>
          <button class="action-btn secondary" id="reviewBtn">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span>复习</span>
          </button>
          <button class="action-btn" id="createWordbookBtn">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>创建单词书</span>
          </button>
        </div>
      </div>
      
      <!-- 单词书选择页面 -->
      <div id="wordbookPage" class="page">
        <div class="page-header">
          <button class="back-btn" id="wordbookBackBtn">← 返回</button>
          <h2>选择单词书</h2>
          <div class="header-actions"></div>
        </div>
        <div class="wordbook-library">
          <div class="wordbook-shelf" id="wordbookShelf"></div>
        </div>
      </div>

      <div id="learnPage" class="page">
        <div class="page-header">
          <button class="back-btn" id="learnBackBtn">← 返回</button>
          <h2>学习模式</h2>
          <div class="progress-info">
            <span id="learnProgress">0/0</span>
          </div>
        </div>
        <div id="learnContent" class="learn-content">
        </div>
      </div>

      <div id="reviewPage" class="page">
        <div class="page-header">
          <button class="back-btn" id="reviewBackBtn">← 返回</button>
          <h2>复习模式</h2>
          <div class="progress-info">
            <span id="reviewProgress">0/0</span>
          </div>
        </div>
        <div id="reviewContent" class="review-content">
        </div>
      </div>

      <div id="overviewPage" class="page">
        <div class="page-header">
          <button class="back-btn" id="overviewBackBtn">← 返回</button>
          <h2>单词总览</h2>
          <div class="header-actions">
            <button class="action-btn-small" id="addWordBtn">添加单词</button>
          </div>
        </div>
        <div class="overview-tabs">
          <button class="tab-btn active" data-tab="all" id="tabAll">全部单词</button>
          <button class="tab-btn" data-tab="new" id="tabNew">今日新学</button>
          <button class="tab-btn" data-tab="review" id="tabReview">今日复习</button>
          <button class="tab-btn" data-tab="learning" id="tabLearning">学习中</button>
        </div>
        <div id="overviewContent" class="overview-content">
        </div>
      </div>
    </main>
  </div>

  <div id="inputModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2 id="inputModalTitle">输入</h2>
        <button class="close-btn" id="closeInputModalBtn">×</button>
      </div>
      <div class="modal-body">
        <p id="inputModalMessage"></p>
        <input type="number" id="inputModalValue">
        <div style="display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end;">
          <button class="submit-btn btn-cancel" id="inputModalCancelBtn">取消</button>
          <button class="submit-btn" id="inputModalConfirmBtn">确定</button>
        </div>
      </div>
    </div>
  </div>

  <div id="addWordModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2>添加单词</h2>
        <button class="close-btn" id="closeAddWordModalBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>英文单词</label>
          <input type="text" id="newWordEnglish" placeholder="例如: hello">
        </div>
        <div class="form-group">
          <label>中文释义</label>
          <input type="text" id="newWordChinese" placeholder="例如: 你好">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end;">
          <button class="submit-btn btn-cancel" id="addWordCancelBtn">取消</button>
          <button class="submit-btn" id="addWordConfirmBtn">添加</button>
        </div>
      </div>
    </div>
  </div>

  <div id="editWordModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2>编辑单词</h2>
        <button class="close-btn" id="closeEditWordModalBtn">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editWordId">
        <div class="form-group">
          <label>英文单词</label>
          <input type="text" id="editWordEnglish">
        </div>
        <div class="form-group">
          <label>中文释义</label>
          <input type="text" id="editWordChinese">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end;">
          <button class="submit-btn btn-danger" id="editWordDeleteBtn">删除</button>
          <button class="submit-btn btn-cancel" id="editWordCancelBtn">取消</button>
          <button class="submit-btn" id="editWordConfirmBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="createWordbookModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2>创建自定义单词书</h2>
        <button class="close-btn" id="closeCreateWordbookModalBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>单词书名称</label>
          <input type="text" id="newWordbookName" placeholder="例如: 我的单词本">
        </div>
        <div class="form-group">
          <label>导入方式</label>
          <div style="display: flex; gap: 12px; margin-top: 12px;">
            <button class="submit-btn" id="importWordBtn" style="flex: 1;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              导入Word文档
            </button>
            <button class="submit-btn" id="importPdfBtn" style="flex: 1;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <path d="M12 18h.01"></path>
                <path d="M8 18h.01"></path>
                <path d="M16 18h.01"></path>
              </svg>
              导入PDF文档
            </button>
          </div>
        </div>
        <div class="form-group" id="manualInputSection" style="display: none;">
          <label>手动输入单词</label>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <input type="text" id="manualEnglish" class="manual-input" placeholder="英文" style="flex: 1;">
            <input type="text" id="manualChinese" class="manual-input" placeholder="中文" style="flex: 1;">
            <button class="submit-btn" id="addManualWordBtn" style="padding: 8px 16px;">添加</button>
          </div>
          <div id="manualWordList" style="margin-top: 12px; max-height: 200px; overflow-y: auto;"></div>
        </div>
        <div class="form-group" id="importProgressSection" style="display: none;">
          <label>导入进度</label>
          <div style="background: var(--hover-bg); border-radius: 8px; padding: 12px; margin-top: 8px;">
            <div id="importProgressText">准备导入...</div>
            <div style="background: var(--border-color); height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden;">
              <div id="importProgressBar" style="background: var(--btn-primary); height: 100%; width: 0%; transition: width 0.3s;"></div>
            </div>
          </div>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end;">
          <button class="submit-btn btn-cancel" id="createWordbookCancelBtn">取消</button>
          <button class="submit-btn" id="createWordbookConfirmBtn">创建</button>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>设置</h2>
        <button class="close-btn" id="closeSettingsBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-section">
          <h3>主题设置</h3>
          <div class="theme-options">
            <button class="theme-btn" data-theme="light">
              <div class="theme-preview" style="background-image: url('assets/background/light/Lundon_1.jpg');"></div>
              <span>浅色</span>
            </button>
            <button class="theme-btn" data-theme="dark">
              <div class="theme-preview" style="background-image: url('assets/background/night/Lundon_1.jpg');"></div>
              <span>深色</span>
            </button>
            <button class="theme-btn" data-theme="custom">
              <div class="theme-preview custom-preview">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72-12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
              </div>
              <span>自定义</span>
            </button>
          </div>
          <div style="margin-top: 16px;">
            <label class="checkbox-label">
              <input type="checkbox" id="enableTimeBasedTheme">
              <span>跟随时间自动切换主题（白天浅色，晚上深色）</span>
            </label>
          </div>
          <div id="backgroundImageSelector" class="background-selector" style="display: none;">
            <label style="display: block; margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">选择背景图片：</label>
            <div id="backgroundImages" class="background-images"></div>
          </div>
          
          <!-- 毛玻璃效果设置 - 对所有主题生效 -->
          <div style="margin-top: 20px; padding: 16px; background: var(--card-bg); border-radius: 8px;">
            <h4 style="margin: 0 0 16px 0; font-size: 14px; color: var(--text-primary);">毛玻璃效果设置</h4>
            <div style="margin-bottom: 16px;">
              <label class="checkbox-label">
                <input type="checkbox" id="enableBlurEffect">
                <span>启用毛玻璃效果</span>
              </label>
            </div>
            <div id="blurIntensitySection" style="display: none;">
              <h5 style="margin: 16px 0 12px 0; font-size: 14px; color: var(--text-secondary);">毛玻璃程度调节</h5>
              
              <div class="blur-control-group">
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">按钮毛玻璃: <span id="buttonBlurValue">20</span>px</label>
                <input type="range" id="buttonBlurIntensity" min="0" max="50" value="20" style="width: 100%;">
              </div>
              
              <div class="blur-control-group" style="margin-top: 12px;">
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">卡片毛玻璃: <span id="cardBlurValue">20</span>px</label>
                <input type="range" id="cardBlurIntensity" min="0" max="50" value="20" style="width: 100%;">
              </div>
              
              <div class="blur-control-group" style="margin-top: 12px;">
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">搜索框毛玻璃: <span id="searchBlurValue">20</span>px</label>
                <input type="range" id="searchBlurIntensity" min="0" max="50" value="20" style="width: 100%;">
              </div>
              
              <div class="blur-control-group" style="margin-top: 12px;">
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">其他元素毛玻璃: <span id="otherBlurValue">20</span>px</label>
                <input type="range" id="otherBlurIntensity" min="0" max="50" value="20" style="width: 100%;">
              </div>
              
              <div class="blur-control-group" style="margin-top: 12px;">
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">背景模糊: <span id="backgroundBlurValue">0</span>px</label>
                <input type="range" id="backgroundBlurIntensity" min="0" max="100" value="0" style="width: 100%;">
              </div>
              
              <button class="submit-btn" id="saveBlurSettingsBtn" style="margin-top: 16px;">保存毛玻璃设置</button>
            </div>
          </div>
          
          <!-- 字体颜色设置 -->
          <div style="margin-top: 20px; padding: 16px; background: var(--card-bg); border-radius: 8px;">
            <h4 style="margin: 0 0 16px 0; font-size: 14px; color: var(--text-primary);">字体颜色设置</h4>
            
            <!-- 浅色模式字体颜色 -->
            <div style="margin-bottom: 24px;">
              <h5 style="margin: 0 0 12px 0; font-size: 14px; color: var(--text-secondary);">浅色模式</h5>
              <div style="display: flex; gap: 16px; margin-bottom: 12px;">
                <div style="flex: 1;">
                  <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">主要文字颜色</label>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="color" id="lightTextPrimary" value="#000000" style="width: 40px; height: 32px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;">
                    <input type="text" id="lightTextPrimaryValue" value="#000000" style="flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; background: var(--input-bg); color: var(--text-primary);">
                  </div>
                </div>
                <div style="flex: 1;">
                  <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">次要文字颜色</label>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="color" id="lightTextSecondary" value="#333333" style="width: 40px; height: 32px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;">
                    <input type="text" id="lightTextSecondaryValue" value="#333333" style="flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; background: var(--input-bg); color: var(--text-primary);">
                  </div>
                </div>
              </div>
            </div>
            
            <!-- 深色模式字体颜色 -->
            <div>
              <h5 style="margin: 0 0 12px 0; font-size: 14px; color: var(--text-secondary);">深色模式</h5>
              <div style="display: flex; gap: 16px;">
                <div style="flex: 1;">
                  <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">主要文字颜色</label>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="color" id="darkTextPrimary" value="#ffffff" style="width: 40px; height: 32px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;">
                    <input type="text" id="darkTextPrimaryValue" value="#ffffff" style="flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; background: var(--input-bg); color: var(--text-primary);">
                  </div>
                </div>
                <div style="flex: 1;">
                  <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">次要文字颜色</label>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="color" id="darkTextSecondary" value="#b0b0b0" style="width: 40px; height: 32px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;">
                    <input type="text" id="darkTextSecondaryValue" value="#b0b0b0" style="flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; background: var(--input-bg); color: var(--text-primary);">
                  </div>
                </div>
              </div>
            </div>
            
            <button class="submit-btn" id="saveThemeSettingsBtn" style="margin-top: 16px;">保存字体颜色设置</button>
          </div>
          
          <div id="customThemeSection" class="custom-theme-section" style="display: none;">
            <input type="file" id="bgImageInput" accept="image/png, image/jpeg">
          </div>
        </div>
        <div class="setting-section">
            <h3>学习设置</h3>
            <div class="learn-settings">
              <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-secondary);">默认学习单词数量</label>
                <input type="number" id="defaultLearnCount" min="1" max="100" value="20" style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; background: var(--input-bg); color: var(--text-primary); width: 120px;">
                <span style="margin-left: 8px; font-size: 14px; color: var(--text-secondary);">建议20-50个</span>
              </div>
              <button class="submit-btn" id="saveLearnSettingsBtn" style="margin-top: 16px;">保存学习设置</button>
            </div>
        </div>
        <div class="setting-section">
            <h3>复习设置</h3>
            <div class="review-settings">
              <label class="checkbox-label">
                <input type="checkbox" id="useCustomReviewSettings">
                <span>使用自定义复习间隔</span>
              </label>
              <label class="checkbox-label" style="margin-top: 12px;">
                <input type="checkbox" id="enableTodayReview">
                <span>启用当天复习</span>
              </label>
              <div id="customReviewSettings" style="display: none; margin-top: 16px;">
              <p style="margin-bottom: 12px; color: #666;">配置错误次数对应的复习天数：</p>
              <div class="error-days-config">
                <div class="error-days-row">
                  <label>错误1次：</label>
                  <input type="number" id="error1Days" min="1" max="30" value="1">
                  <span>天后复习</span>
                </div>
                <div class="error-days-row">
                  <label>错误2次：</label>
                  <input type="number" id="error2Days" min="1" max="30" value="1">
                  <span>天后复习</span>
                </div>
                <div class="error-days-row">
                  <label>错误3次：</label>
                  <input type="number" id="error3Days" min="1" max="30" value="2">
                  <span>天后复习</span>
                </div>
                <div class="error-days-row">
                  <label>错误4次：</label>
                  <input type="number" id="error4Days" min="1" max="30" value="3">
                  <span>天后复习</span>
                </div>
                <div class="error-days-row">
                  <label>错误5次：</label>
                  <input type="number" id="error5Days" min="1" max="30" value="3">
                  <span>天后复习</span>
                </div>
              </div>
              <button class="submit-btn" id="saveReviewSettingsBtn" style="margin-top: 16px;">保存设置</button>
            </div>
          </div>
        </div>
        <div class="setting-section">
          <h3>数据管理</h3>
          <div class="data-management">
            <h3 style="margin-top: 0;">全屏模式</h3>
            <label class="checkbox-label">
              <input type="checkbox" id="enableFullscreen">
              <span>启用全屏学习模式</span>
            </label>
            <p style="margin-top: 12px; color: #666; font-size: 13px;">启用后可以按F11进入全屏，获得更专注的学习体验。</p>
          </div>

          <div class="data-management">
            <p style="margin-bottom: 12px; color: #666;">重置数据库将删除所有学习数据和自定义词书，并重新导入默认词书（CET4乱序版、CET6、考研）。</p>
            <button class="submit-btn" id="resetDatabaseBtn" style="background-color: #e74c3c;">重置数据库</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="wordDetailModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2>单词详情</h2>
        <button class="close-btn" id="closeWordDetailModalBtn">×</button>
      </div>
      <div class="modal-body" id="wordDetailContent">
      </div>
    </div>
  </div>

  <div id="musicModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>在线音乐</h2>
        <button class="close-btn" id="closeMusicModalBtn">×</button>
      </div>
      <div class="modal-body">
        <iframe src="https://music.cpp-prog.com/" id="musicIframe" class="music-iframe"></iframe>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
